services:
  clawcare:
    build: .
    restart: unless-stopped
    volumes:
      - clawcare-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'
volumes:
  clawcare-data:
